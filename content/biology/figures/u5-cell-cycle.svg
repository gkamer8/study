<line x1="623.0" y1="195.3" x2="623.0" y2="208.7" stroke="#222" stroke-width="2.2399999999999998"/>
<text x="520.0" y="194.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">P</text>
<line x1="678.0" y1="202.0" x2="691.7" y2="202.0" stroke="#222" stroke-width="1.2"/>
<polygon points="698.0,202.0 691.8,205.3 691.8,198.7" fill="#222" stroke="none" stroke-width="1"/>
<text x="652.0" y="230.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#4f7d47">S-phase genes ON</text>
<rect x="430.0" y="242.0" width="84.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="472.0" y="260.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#222">p16 (INK4)</text>
<line x1="472.0" y1="242.0" x2="472.0" y2="220.0" stroke="#222" stroke-width="1.3"/>
<line x1="465.4" y1="220.0" x2="478.6" y2="220.0" stroke="#222" stroke-width="2.08"/>
<text x="520.0" y="260.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#666" font-style="italic">palbociclib also blocks CDK4/6</text>
<text x="420.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="start" fill="#222">p21 and p27 (CIP/KIP) block CDK2 and CDK1.</text>
<text x="420.0" y="314.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="start" fill="#a8473a">Checkpoints (red) halt the cycle: DNA damage</text>
<text x="420.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="start" fill="#a8473a">at G1/S and G2/M; unattached chromosomes</text>
<text x="420.0" y="342.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="start" fill="#a8473a">at the spindle checkpoint (before anaphase).</text>
<text x="420.0" y="368.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#666">Phase lengths are typical, not fixed.</text>
</svg>
