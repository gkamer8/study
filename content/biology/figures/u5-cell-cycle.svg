<rect x="548.0" y="188.0" width="44.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="570.0" y="206.1" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">RB</text>
<rect x="627.0" y="188.0" width="50.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="652.0" y="206.1" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">E2F</text>
