<text x="346.2" y="98.9" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#666">resting</text>
<line x1="281.8" y1="79.4" x2="322.8" y2="73.6" stroke="#666" stroke-width="1"/>
<text x="420.0" y="50.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="start" fill="#222" font-weight="bold">Cyclin–CDK pairs that drive each step</text>
<text x="420.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">G1</text>
<text x="468.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222">cyclin D – CDK4/6</text>
<text x="420.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">G1/S</text>
<text x="468.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222">cyclin E – CDK2</text>
<text x="420.0" y="108.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">S</text>
<text x="468.0" y="108.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222">cyclin A – CDK2</text>
<text x="420.0" y="126.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">G2/M</text>
<text x="468.0" y="126.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222">cyclin B – CDK1</text>
<text x="420.0" y="172.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="12" text-anchor="start" fill="#222" font-weight="bold">Commitment in G1</text>
