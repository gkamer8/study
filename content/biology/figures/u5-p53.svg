<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img">
<title>The p53 DNA-damage response and the MDM2 feedback loop</title>
<rect width="100%" height="100%" fill="#fff"/>
<text x="16.0" y="22.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="13" text-anchor="start" fill="#222" font-weight="bold">p53: DNA damage → p53 → arrest or death, with MDM2 feedback</text>
<rect x="16.0" y="40.0" width="330.0" height="120.0" rx="6" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="22.0" y="58.0" width="136.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="90.0" y="76.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#222">double-strand break</text>
<rect x="175.0" y="58.0" width="50.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="200.0" y="76.5" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">ATM</text>
<rect x="260.0" y="58.0" width="60.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="290.0" y="76.5" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">CHK2</text>
<rect x="22.0" y="109.0" width="136.0" height="38.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="90.0" y="126.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#222">ssDNA, stalled</text>
<text x="90.0" y="140.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#666">replication</text>
<rect x="175.0" y="114.0" width="50.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="200.0" y="132.5" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">ATR</text>
<rect x="260.0" y="114.0" width="60.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="290.0" y="132.5" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">CHK1</text>
<line x1="160.0" y1="72.0" x2="165.7" y2="72.0" stroke="#222" stroke-width="1.4"/>
<polygon points="172.0,72.0 165.8,75.3 165.8,68.7" fill="#222" stroke="none" stroke-width="1"/>
<line x1="227.0" y1="72.0" x2="250.7" y2="72.0" stroke="#222" stroke-width="1.4"/>
<polygon points="257.0,72.0 250.8,75.3 250.8,68.7" fill="#222" stroke="none" stroke-width="1"/>
<line x1="160.0" y1="128.0" x2="165.7" y2="128.0" stroke="#222" stroke-width="1.4"/>
<polygon points="172.0,128.0 165.8,131.3 165.8,124.7" fill="#222" stroke="none" stroke-width="1"/>
<line x1="227.0" y1="128.0" x2="250.7" y2="128.0" stroke="#222" stroke-width="1.4"/>
<polygon points="257.0,128.0 250.8,131.3 250.8,124.7" fill="#222" stroke="none" stroke-width="1"/>
<text x="180.0" y="176.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#666">sensor and checkpoint kinases (ATM, ATR, CHK1, CHK2)</text>
<rect x="395.0" y="78.0" width="150.0" height="44.0" rx="4" fill="#e4ecf5" stroke="#222" stroke-width="1"/>
<text x="470.0" y="98.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">p53</text>
<text x="470.0" y="112.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#666">transcription factor</text>
<line x1="348.0" y1="100.0" x2="385.7" y2="100.0" stroke="#222" stroke-width="1.6"/>
<polygon points="392.0,100.0 385.8,103.3 385.8,96.7" fill="#222" stroke="none" stroke-width="1"/>
<text x="370.0" y="88.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">P</text>
<text x="16.0" y="196.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#666">These kinases phosphorylate p53 (e.g. Ser15). Phosphorylated</text>
<text x="16.0" y="210.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#666">p53 escapes MDM2, so p53 protein builds up.</text>
<rect x="395.0" y="231.0" width="150.0" height="38.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="470.0" y="248.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">MDM2</text>
<text x="470.0" y="262.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#666">E3 ubiquitin ligase</text>
<line x1="440.0" y1="230.0" x2="440.0" y2="124.0" stroke="#222" stroke-width="1.6"/>
<line x1="433.4" y1="124.0" x2="446.6" y2="124.0" stroke="#222" stroke-width="2.5600000000000005"/>
<text x="432.0" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="end" fill="#222">ubiquitinates p53</text>
<text x="432.0" y="183.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="end" fill="#666">→ proteasome</text>
<line x1="500.0" y1="124.0" x2="500.0" y2="223.7" stroke="#222" stroke-width="1.6"/>
<polygon points="500.0,230.0 496.7,223.8 503.3,223.8" fill="#222" stroke="none" stroke-width="1"/>
<text x="508.0" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#222">induces the</text>
<text x="508.0" y="183.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#222">MDM2 gene</text>
<text x="470.0" y="290.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#666" font-style="italic">negative feedback loop</text>
<rect x="592.0" y="45.0" width="96.0" height="38.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="640.0" y="62.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="12.5" text-anchor="middle" fill="#222" font-weight="bold">p21</text>
<text x="640.0" y="76.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#666">CDKN1A</text>
<rect x="575.0" y="146.0" width="130.0" height="28.0" rx="4" fill="#fff" stroke="#222" stroke-width="1"/>
<text x="640.0" y="164.1" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="middle" fill="#222" font-weight="bold">BAX, PUMA, NOXA</text>
<line x1="546.0" y1="92.0" x2="584.4" y2="72.8" stroke="#222" stroke-width="1.4"/>
<polygon points="590.0,70.0 585.9,75.7 583.0,69.8" fill="#222" stroke="none" stroke-width="1"/>
<line x1="546.0" y1="110.0" x2="570.4" y2="144.8" stroke="#222" stroke-width="1.4"/>
<polygon points="574.0,150.0 567.8,146.8 573.1,143.1" fill="#222" stroke="none" stroke-width="1"/>
<text x="640.0" y="104.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#4f7d47">CDKs off: cell-cycle</text>
<text x="640.0" y="117.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#4f7d47">pause or senescence</text>
<text x="640.0" y="192.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="middle" fill="#4f7d47">apoptosis</text>
<text x="556.0" y="66.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="1" text-anchor="start" fill="#222"></text>
<text x="16.0" y="320.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11.5" text-anchor="start" fill="#222" font-weight="bold">In cancer:</text>
<text x="16.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="start" fill="#a8473a">TP53 missense hotspots (R175, R248, R273) in the DNA-binding domain stop p53 from switching on its targets.</text>
<text x="16.0" y="354.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="start" fill="#a8473a">MDM2 amplification destroys p53 faster. Inherited TP53 mutation = Li-Fraumeni syndrome.</text>
<line x1="16.0" y1="384.0" x2="35.7" y2="384.0" stroke="#222" stroke-width="1.4"/>
<polygon points="42.0,384.0 35.8,387.3 35.8,380.7" fill="#222" stroke="none" stroke-width="1"/>
<text x="48.0" y="388.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#666">activates / induces</text>
<line x1="166.0" y1="384.0" x2="192.0" y2="384.0" stroke="#222" stroke-width="1.4"/>
<line x1="192.0" y1="377.4" x2="192.0" y2="390.6" stroke="#222" stroke-width="2.2399999999999998"/>
<text x="200.0" y="388.0" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-size="10.5" text-anchor="start" fill="#666">inhibits / degrades</text>
</svg>
